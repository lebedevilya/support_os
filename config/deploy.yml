service: support_os

image: lebedevilya/support_os

servers:
  web:
    - 147.135.78.29

proxy:
  ssl: true
  host: supportos.ilyalebe.dev
  app_port: 3000
  response_timeout: 3600
  healthcheck:
    path: /up
    interval: 3
    timeout: 30

registry:
  server: ghcr.io
  username: <%= ENV.fetch("KAMAL_REGISTRY_USERNAME", "lebedevilya") %>
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64
  remote: ssh://debian@147.135.78.29

volumes:
  - "/home/debian/apps/support_os/storage:/rails/storage"

env:
  clear:
    RAILS_LOG_LEVEL: info
    RAILS_FORCE_SSL: "true"
    RAILS_SERVE_STATIC_FILES: "true"
    SOLID_QUEUE_IN_PUMA: "true"
    OPENCLAW_HOOKS_URL: "http://172.18.0.1:18789/hooks/agent"
  secret:
    - RAILS_MASTER_KEY
    - GITHUB_WEBHOOK_SECRET
    - OPENCLAW_HOOKS_TOKEN

ssh:
  user: debian
